# Westalife Residence — PROD dağıtım composition
# Kullanım: .env.example -> .env kopyalanip doldurulur, sonra:
#   docker compose -f docker-compose.prod.yml up -d --build
# Mimari: yalnızca web servisi (nginx) 80 portuyla disariya acilir.
#   web (nginx)  -> / (React SPA) + /api/ -> api:8080 (reverse proxy, ayni origin, CORS yok)
#   api          -> ic agda, migration bundle once calisir (migrator)
#   db           -> ic agda, UTF-8 + tr-TR ICU collation

name: sayacokuma-prod

services:
  db:
    image: postgres:18-alpine
    container_name: sayacokuma-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # UTF-8 zorunlulugu + Turkce siralama (Kural: DB UTF-8)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=tr-TR"
    volumes:
      - sayacokuma_pgdata_prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Gece 03:00 (Europe/Istanbul) pg_dump → ./backups/*.sql.gz (30 gün retention)
  db-backup:
    build:
      context: .
      dockerfile: scripts/Dockerfile.backup
    image: sayacokuma-db-backup:latest
    container_name: sayacokuma-prod-db-backup
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  migrator:
    image: sayacokuma-api:latest
    container_name: sayacokuma-prod-migrator
    # API imajinin icine gomulu migration bundle (/app/migrate)
    entrypoint: ["/app/migrate", "--connection", "${DATABASE_CONNECTION}"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: sayacokuma-api:latest
    build:
      context: .
      dockerfile: src/api/Westalife.Api/Dockerfile
    container_name: sayacokuma-prod-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION}
      Security__ApiKey: ${SECURITY_API_KEY:?SECURITY_API_KEY .env icinde tanimli olmali}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?AUTH_SIGNING_KEY .env icinde tanimli olmali}
      Auth__SeedPassword: ${AUTH_SEED_PASSWORD:?AUTH_SEED_PASSWORD .env icinde tanimli olmali}
      ResidentDocuments__RootPath: /app/data/resident-documents
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      # Serilog file sink (relative path logs/) — Kural #2: mutlak yol yok
      # TraceId her satırda; Faz 7'de UserId/TenantId eklenecek
      - sayacokuma_api_logs:/app/logs
      - sayacokuma_resident_documents:/app/data/resident-documents
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  web:
    image: sayacokuma-web:latest
    build:
      context: src/frontend
      dockerfile: Dockerfile
    container_name: sayacokuma-prod-web
    restart: unless-stopped
    environment:
      # nginx sablonu bu degeri X-Api-Key basligi olarak API'ye iletir.
      SECURITY_API_KEY: ${SECURITY_API_KEY:?SECURITY_API_KEY .env icinde tanimli olmali}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sayacokuma_pgdata_prod:
  sayacokuma_api_logs:
  sayacokuma_resident_documents:
