server {
    listen 80;
    server_name _;

    # CSS/JS dogru MIME turuyla sunulsun (text/css, application/javascript)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Statik dosyalarin koku — tum location'lar icin gecerli
    root /usr/share/nginx/html;

    # Excel ice aktarma icin yeterli gorev boyutu
    client_max_body_size 10m;

    # Gzip: JSON/JS/CSS
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy: ayni origin (CORS yok) — api servisi yalnizca ic agda.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API anahtari nginx'te eklenir (JS bundle'a girmez; <img>/indirme linkleri de calisir).
        # Deger konteyner env SECURITY_API_KEY'den gelir (nginx envsubst sablonu).
        proxy_set_header X-Api-Key "${SECURITY_API_KEY}";
        proxy_read_timeout 120s; # 72 sayfalik PDF uretimi icin
    }

    # Konteyner/dis monitoring saglik ucu da API'ye yonlendirilir.
    location = /health {
        proxy_pass http://api:8080/health;
    }

    # Hash'li statik dosyalar: dogrudan diskten, SPA fallback'e DUSMEZ (404 doner);
    # 1 yil cache (hash'li dosya adlari).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: React Router deep-link'ler (ornek: /reports?invoice=...) calisir
    location / {
        try_files $uri /index.html;
    }
}
